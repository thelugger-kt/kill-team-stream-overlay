<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Overlay - Top</title>
<link rel="stylesheet" href="topbar.css"></head>
<body class="">
<div class="stage">
<div class="strip"></div>
<div class="logo l"><span>LOGO 1</span><img src="assets/logo1.png" onerror="this.remove()"></div>
<div class="logo r"><span>LOGO 2</span><img src="assets/logo2.png" onerror="this.remove()"></div>
<div class="bar">
 <div class="side l"><div class="team"><img data-icon="1"></div><div class="scores"><div class="cell"><div class="lb">CRIT</div><div class="v" data-v="crit1">0</div></div><div class="cell"><div class="lb">KILL</div><div class="v" data-v="kill1">0</div></div><div class="cell"><div class="lb">TAC</div><div class="v" data-v="tac1">0</div></div><div class="cell"><div class="lb">CP</div><div class="v" data-v="cp1">0</div></div></div></div>
 <div class="tp"><div class="lb">TURN</div><div class="v" data-v="tp">3</div></div>
 <div class="side r"><div class="team"><img data-icon="2"></div><div class="scores"><div class="cell"><div class="lb">CRIT</div><div class="v" data-v="crit2">0</div></div><div class="cell"><div class="lb">KILL</div><div class="v" data-v="kill2">0</div></div><div class="cell"><div class="lb">TAC</div><div class="v" data-v="tac2">0</div></div><div class="cell"><div class="lb">CP</div><div class="v" data-v="cp2">0</div></div></div></div>
 <div class="initbar"><i class="tri" data-init="1"></i><b>INITIATIVE</b><i class="tri" data-init="2"></i></div>
 <div class="critop"></div>
<div class="tacop l" data-tacop="left"></div><div class="tacop r" data-tacop="right"></div>
 <div class="names l"><span class="f" data-team="1"></span><span data-player="1"></span></div>
 <div class="names r"><span class="f" data-team="2"></span><span data-player="2"></span></div>
</div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="topbar.js"></script></body></html>
